<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120"><text x="26" y="18" font-size="7" font-weight="600" fill="#d64545" text-anchor="middle" font-family="monospace">block</text><rect x="6" y="24" width="40" height="30" rx="4" fill="#ffffff" stroke="#b4b4c8" stroke-width="2"/><rect x="12" y="36" width="28" height="6" rx="2" fill="none" stroke="#dcdce8" stroke-dasharray="2 2"/><text x="80" y="18" font-size="7" font-weight="600" fill="#d98a1c" text-anchor="middle" font-family="monospace">swap</text><rect x="60" y="24" width="40" height="30" rx="4" fill="#ffffff" stroke="#b4b4c8" stroke-width="2"/><text x="80" y="46" font-size="14" font-weight="400" fill="#8a8aa3" text-anchor="middle" font-family="serif">Aa</text><text x="134" y="18" font-size="7" font-weight="600" fill="#2f9e5b" text-anchor="middle" font-family="monospace">optional</text><rect x="114" y="24" width="40" height="30" rx="4" fill="#ffffff" stroke="#b4b4c8" stroke-width="2"/><text x="134" y="46" font-size="14" font-weight="700" fill="#1a1a2e" text-anchor="middle" font-family="sans-serif">Aa</text><text x="26" y="70" font-size="6.5" font-weight="600" fill="#8a8aa3" text-anchor="middle" font-family="sans-serif">invisible</text><text x="80" y="70" font-size="6.5" font-weight="600" fill="#8a8aa3" text-anchor="middle" font-family="sans-serif">fallback, then</text><text x="80" y="79" font-size="6.5" font-weight="600" fill="#8a8aa3" text-anchor="middle" font-family="sans-serif">font (may shift)</text><text x="134" y="70" font-size="6.5" font-weight="600" fill="#8a8aa3" text-anchor="middle" font-family="sans-serif">font if ready,</text><text x="134" y="79" font-size="6.5" font-weight="600" fill="#8a8aa3" text-anchor="middle" font-family="sans-serif">else fallback</text></svg>
