<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120"><text x="80" y="14" font-size="6.5" font-weight="600" fill="#8a8aa3" text-anchor="middle" font-family="sans-serif">fallback vs web font</text><text x="10" y="32" font-size="6.5" font-weight="600" fill="#d64545" text-anchor="start" font-family="sans-serif">before</text><rect x="10" y="38" width="60" height="8" rx="2" fill="#dcdce8"/><rect x="10" y="48" width="72" height="8" rx="2" fill="#d64545" opacity="0.5"/><text x="90" y="32" font-size="6.5" font-weight="600" fill="#2f9e5b" text-anchor="start" font-family="monospace">size-adjust</text><rect x="90" y="38" width="62" height="8" rx="2" fill="#dcdce8"/><rect x="90" y="38" width="62" height="8" rx="2" fill="#2f9e5b" opacity="0.5"/><text x="10" y="76" font-size="6.5" font-weight="600" fill="#5b5bd6" text-anchor="start" font-family="monospace">@font-face {</text><text x="16" y="86" font-size="6.5" font-weight="600" fill="#5b5bd6" text-anchor="start" font-family="monospace">size-adjust: 106%;</text><text x="16" y="96" font-size="6.5" font-weight="600" fill="#5b5bd6" text-anchor="start" font-family="monospace">ascent-override: 92%;</text><text x="10" y="106" font-size="6.5" font-weight="600" fill="#5b5bd6" text-anchor="start" font-family="monospace">}</text></svg>
